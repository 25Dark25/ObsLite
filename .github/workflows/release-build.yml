name: Release build

# Run by hand on a release tag. It produces the executable, the third-party
# license notices and their SHA-256 as an artifact; the maintainer downloads,
# verifies and signs them locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache here, so a poisoned cache entry can never reach a release.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - name: Build
        run: cargo build --locked --release
      # Keep version and hash in sync with ci.yml.
      - name: Install cargo-about
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-about.tar.gz" https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-pc-windows-msvc.tar.gz
          echo "1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-pc-windows-msvc" >> "$GITHUB_PATH"
      - name: Third-party licenses
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Checksum
        shell: bash
        run: |
          mkdir dist
          cp target/release/obs-lite.exe THIRD-PARTY-LICENSES.html dist/
          cd dist
          sha256sum obs-lite.exe THIRD-PARTY-LICENSES.html | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obs-lite-${{ github.sha }}
          path: dist/
          if-no-files-found: error
