name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    # obs-lite uses Windows-only APIs; it does not build on Linux or macOS.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep the first entry in sync with `rust-version` in Cargo.toml.
        toolchain: ["1.95", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
          rustup default ${{ matrix.toolchain }}
          rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release

  deny:
    name: cargo-deny
    # The action runs in a Docker container, so it needs Linux; deny.toml
    # restricts the dependency graph to the Windows target.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  licenses:
    name: third-party licenses
    # Fails if any dependency has a license that is not accepted in about.toml,
    # so release builds can always generate THIRD-PARTY-LICENSES.html.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep version and hash in sync with release-build.yml.
      - name: Install cargo-about
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-about.tar.gz" https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-pc-windows-msvc.tar.gz
          echo "1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-pc-windows-msvc" >> "$GITHUB_PATH"
      - name: Generate THIRD-PARTY-LICENSES.html
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.html

  # Single stable check for the branch ruleset: fails if any job above failed,
  # was cancelled or was skipped.
  all-tests:
    name: all-tests
    if: always()
    needs: [test, deny, licenses]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
