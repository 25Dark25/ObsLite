[package]
name = "obs-lite"
version = "0.1.0"
edition = "2024"
description = "Lightweight screen recorder for Windows"
license = "MIT"
repository = "https://github.com/25Dark25/obs-lite"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "0.8.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Foundation", "Graphics_DirectX_Direct3D11", "Media_Core", "Media_MediaProperties", "Media_Transcoding", "Security_Cryptography", "Storage", "Storage_Streams", "System_Threading", "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_WinRT_Direct3D11"] }
windows-capture = "2.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
