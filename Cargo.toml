[package]
name = "obs-lite"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Lightweight screen recorder for Windows"
license = "MIT"
repository = "https://github.com/25Dark25/obs-lite"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "0.8.0"
nnnoiseless = { version = "0.5.2", default-features = false }
png = "0.18.1"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26.0", default-features = false }
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Web_Http", "Web_Http_Headers"] }
windows-capture = "2.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
