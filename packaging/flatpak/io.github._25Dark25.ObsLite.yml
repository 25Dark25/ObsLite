# Flatpak build of obs-lite. From the repository root, with flatpak-builder and the Flathub remote:
#
#   cargo vendor --locked vendor > /dev/null   # the build has no network; it reads ./vendor
#   flatpak-builder --user --install-deps-from=flathub --force-clean --install \
#     build-flatpak packaging/flatpak/io.github._25Dark25.ObsLite.yml
#
# The runtime provides GStreamer with the encoders obs-lite looks for: VA-API and NVENC
# (hardware), and x264 from the codecs-extra extension, which Flatpak installs with it.
id: io.github._25Dark25.ObsLite
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: obs-lite
finish-args:
  # The window: Wayland, or X11 where there is no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The GPU: drawing the window and hardware H.264 encoding. Without it both fall to the CPU.
  - --device=dri
  # Desktop audio (an output's monitor) and the microphone; there is no portal for desktop
  # audio. The screen, the webcam and global hotkeys go through portals, which ask the user.
  - --socket=pulseaudio
  # The default folder for recordings and screenshots; others are granted through the
  # folder picker (a portal).
  - --filesystem=xdg-videos
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: obs-lite
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/obs-lite/cargo
    build-commands:
      - >-
        cargo --offline
        --config 'source.crates-io.replace-with="vendored-sources"'
        --config 'source.vendored-sources.directory="vendor"'
        build --release --locked
      - install -Dm755 target/release/obs-lite -t /app/bin
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      # Drawn by build.rs, like the Windows icon.
      - install -Dm644 target/release/build/obs-lite-*/out/icon256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 LICENSE -t /app/share/licenses/${FLATPAK_ID}
      # Generated by cargo-about in release builds.
      - if [ -f THIRD-PARTY-LICENSES.html ]; then install -Dm644 THIRD-PARTY-LICENSES.html -t /app/share/licenses/${FLATPAK_ID}; fi
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build-flatpak
          - flatpak-repo
          - target
